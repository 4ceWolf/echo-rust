<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Echo — Hero (Lovable direction)</title>
<style>
/* =====================================================================
   HERO — faithful reproduction of the Lovable "Now Playing" screen.
   Near-black, single crimson accent, editorial type, minimal chrome.
   Sample data / CSS-generated art. Standalone, no deps.
   ===================================================================== */
:root{
  --red:#e2372f;
  --red-bright:#f24b41;
  --red-deep:#8f1512;
  --bg:#0a0a0b;
  --card:#111112;
  --card-2:#161617;
  --line:#212124;
  --line-2:#2c2c30;
  --text:#f4f4f5;
  --muted:#8b8b90;
  --muted-2:#5e5e63;
  --r:16px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{ margin:0; background:var(--bg); color:var(--text); overflow:hidden;
  font-family:"Inter","SF Pro Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; letter-spacing:.1px; font-size:14px; }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
::-webkit-scrollbar{ width:10px; }
::-webkit-scrollbar-thumb{ background:#242427; border-radius:20px; border:3px solid transparent; background-clip:padding-box; }

.app{ display:flex; height:100vh; }

/* ---------------- sidebar ---------------- */
.side{ width:100px; flex:0 0 100px; display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:22px 0 18px; border-right:1px solid var(--line); background:linear-gradient(180deg,#0c0c0d,#0a0a0b); }
.side .brand{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; margin-bottom:26px; position:relative; }
.side .brand svg{ width:26px; height:26px; }
.side .brand::after{ content:""; position:absolute; left:-30px; top:50%; transform:translateY(-50%); width:3px; height:26px; border-radius:3px; background:var(--red); box-shadow:0 0 12px var(--red); }
.side-nav{ display:flex; flex-direction:column; gap:10px; width:100%; align-items:center; }
.side-nav button{ width:52px; height:52px; border-radius:14px; display:grid; place-items:center; color:#7c7c82; position:relative; transition:.2s var(--ease); }
.side-nav button svg{ width:23px; height:23px; }
.side-nav button:hover{ color:#cfcfd4; background:#151516; }
.side-nav button.on{ color:var(--text); background:#1a1a1c; }
.side-nav button.on::before{ content:""; position:absolute; left:-24px; top:50%; transform:translateY(-50%); width:3px; height:24px; border-radius:3px; background:var(--red); box-shadow:0 0 12px var(--red); }
.side-now{ margin-top:auto; display:flex; flex-direction:column; align-items:center; gap:8px; padding-bottom:10px; }
.side-now .wf{ display:flex; align-items:flex-end; gap:2px; height:26px; }
.side-now .wf i{ width:2.5px; background:var(--red); border-radius:2px; box-shadow:0 0 6px rgb(226 55 47/.6); }
.side-now span{ font-size:9px; letter-spacing:.6px; color:var(--muted); }
.side-settings{ width:52px; height:52px; border-radius:14px; display:grid; place-items:center; color:#7c7c82; transition:.2s var(--ease); }
.side-settings:hover{ color:#cfcfd4; background:#151516; }

/* ---------------- main ---------------- */
.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.content{ flex:1; min-height:0; overflow-y:auto; padding:34px 40px 30px; }
.page-head{ margin-bottom:26px; }
.eyebrow{ font-size:11px; font-weight:700; letter-spacing:2.2px; text-transform:uppercase; color:var(--red); }
.page-head h1{ margin:8px 0 0; font-size:46px; font-weight:800; letter-spacing:-1.4px; line-height:1.02; }

.grid{ display:grid; grid-template-columns:1fr 340px; gap:22px; align-items:start; }
@media(max-width:1100px){ .grid{ grid-template-columns:1fr; } }

/* ---------------- hero card ---------------- */
.hero{ position:relative; border-radius:var(--r); overflow:hidden; min-height:520px; background:#080808;
  border:1px solid var(--line); box-shadow:0 30px 70px rgb(0 0 0/.6), inset 0 1px 0 rgb(255 255 255/.04); }
.hero-art{ position:absolute; inset:0; background-size:cover; background-position:center; transform:scale(1.04); transition:transform 6s var(--ease); }
.hero:hover .hero-art{ transform:scale(1.09); }
.hero-art::after{ content:""; position:absolute; inset:0;
  background:linear-gradient(160deg, rgb(255 138 120/.6), rgb(170 26 28/.28) 52%, transparent 76%);
  clip-path:polygon(37% 4%, 75% 63%, 19% 93%);
  mix-blend-mode:screen; opacity:.85; }
.hero-scrim{ position:absolute; inset:0; background:
  linear-gradient(90deg, rgb(6 6 6/.82) 0%, rgb(6 6 6/.35) 46%, transparent 70%),
  linear-gradient(0deg, rgb(6 6 6/.9) 0%, transparent 46%); }
.hero-content{ position:relative; z-index:2; height:100%; min-height:520px; display:flex; flex-direction:column; justify-content:flex-end;
  padding:40px 44px 38px; }
.hero-now{ display:flex; align-items:center; gap:11px; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#d9d9dc; margin-bottom:14px; }
.hero-now .wf{ display:flex; align-items:flex-end; gap:2.5px; height:18px; }
.hero-now .wf i{ width:3px; border-radius:2px; background:var(--red); box-shadow:0 0 8px rgb(226 55 47/.7); }
.hero h2{ margin:0; font-size:68px; font-weight:800; letter-spacing:-2.4px; line-height:.98; text-shadow:0 4px 30px rgb(0 0 0/.7); }
.hero .artist{ margin-top:12px; font-size:20px; color:#b9b9be; }
.progress{ margin-top:26px; }
.progress .bar{ position:relative; height:4px; border-radius:4px; background:rgb(255 255 255/.16); }
.progress .bar i{ position:absolute; inset:0 auto 0 0; width:3%; border-radius:4px; background:var(--red); box-shadow:0 0 12px rgb(226 55 47/.8); }
.progress .bar .thumb{ position:absolute; top:50%; width:14px; height:14px; border-radius:50%; background:var(--red); transform:translate(-50%,-50%);
  box-shadow:0 0 0 4px rgb(226 55 47/.18),0 0 14px rgb(226 55 47/.7); }
.progress .times{ display:flex; justify-content:space-between; margin-top:10px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.hero .heart{ position:absolute; right:40px; bottom:64px; width:46px; height:46px; border-radius:50%; display:grid; place-items:center; color:var(--red);
  background:rgb(226 55 47/.12); border:1px solid rgb(226 55 47/.35); transition:.2s var(--ease); }
.hero .heart svg{ width:20px; height:20px; }
.hero .heart:hover{ background:rgb(226 55 47/.22); transform:scale(1.06); }
.hero .heart.off{ color:#8b8b90; background:rgb(255 255 255/.06); border-color:rgb(255 255 255/.14); }

/* ---------------- up next / signal panel ---------------- */
.panel{ border-radius:var(--r); background:var(--card); border:1px solid var(--line); padding:24px 24px 22px;
  box-shadow:0 20px 50px rgb(0 0 0/.45), inset 0 1px 0 rgb(255 255 255/.035); }
.un-head{ display:flex; align-items:center; justify-content:space-between; }
.un-head h3{ margin:0; font-size:23px; font-weight:750; letter-spacing:-.4px; }
.un-head svg{ width:20px; height:20px; color:var(--red); }
.un-sub{ margin-top:3px; font-size:13px; color:var(--muted); }
.un-list{ margin-top:20px; display:flex; flex-direction:column; gap:16px; }
.un-row{ display:flex; align-items:center; gap:13px; }
.un-row .art{ width:44px; height:44px; border-radius:8px; flex:0 0 auto; background-size:cover; box-shadow:inset 0 0 0 1px rgb(255 255 255/.06); }
.un-row .meta{ min-width:0; flex:1; }
.un-row .meta b{ display:block; font-size:14px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.un-row .meta i{ display:block; font-style:normal; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.un-row .dur{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; flex:0 0 auto; }
.divider{ height:1px; background:var(--line); margin:24px 0 20px; }
.signal-label{ font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--muted-2); margin-bottom:14px; }
.signal-tiles{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.tile{ background:var(--card-2); border:1px solid var(--line); border-radius:11px; padding:14px 16px; }
.tile b{ display:block; font-size:19px; font-weight:700; letter-spacing:-.3px; }
.tile span{ display:block; margin-top:3px; font-size:11.5px; color:var(--muted); }

/* ---------------- player bar ---------------- */
.playerbar{ flex:0 0 auto; height:78px; display:flex; align-items:center; gap:18px; padding:0 26px;
  background:linear-gradient(180deg,#0d0d0e,#0a0a0b); border-top:1px solid var(--line); }
.pb-left{ display:flex; align-items:center; gap:13px; width:270px; flex:0 0 auto; min-width:0; }
.pb-left .art{ width:50px; height:50px; border-radius:9px; background-size:cover; flex:0 0 auto; box-shadow:inset 0 0 0 1px rgb(255 255 255/.06); }
.pb-left .meta{ min-width:0; }
.pb-left .meta b{ display:block; font-size:14px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pb-left .meta i{ display:block; font-style:normal; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pb-heart{ width:30px; height:30px; border-radius:8px; display:grid; place-items:center; color:var(--red); flex:0 0 auto; }
.pb-heart svg{ width:17px; height:17px; }
.pb-heart.off{ color:#6a6a70; }

.pb-center{ flex:1; display:flex; align-items:center; justify-content:center; gap:12px; }
.pill{ display:flex; align-items:center; gap:2px; padding:5px; border-radius:30px; background:#141415; border:1px solid var(--line); }
.pill button{ width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:#8b8b90; transition:.18s var(--ease); }
.pill button svg{ width:17px; height:17px; }
.pill button:hover{ color:var(--text); background:#1e1e20; }
.pill button.txt{ font-size:15px; font-weight:600; }
.pb-play{ width:58px; height:58px; border-radius:50%; display:grid; place-items:center; color:#0a0a0b; background:#f4f4f5;
  box-shadow:0 8px 24px rgb(0 0 0/.6); transition:.18s var(--ease); }
.pb-play:hover{ transform:scale(1.05); background:#fff; }
.pb-play svg{ width:22px; height:22px; }
.pb-skip{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:#c9c9ce; transition:.18s var(--ease); }
.pb-skip:hover{ color:#fff; background:#1a1a1c; }
.pb-skip svg{ width:19px; height:19px; }

.pb-right{ display:flex; align-items:center; gap:14px; width:270px; flex:0 0 auto; justify-content:flex-end; }
.pb-right .vicon{ color:#8b8b90; }
.pb-right .vicon svg{ width:19px; height:19px; }
.vol{ position:relative; width:150px; height:4px; border-radius:4px; background:rgb(255 255 255/.16); }
.vol i{ position:absolute; inset:0 auto 0 0; width:72%; border-radius:4px; background:var(--red); box-shadow:0 0 10px rgb(226 55 47/.6); }
.vol .knob{ position:absolute; top:50%; left:72%; width:14px; height:14px; border-radius:50%; background:var(--red); transform:translate(-50%,-50%);
  box-shadow:0 0 0 4px rgb(226 55 47/.15),0 0 12px rgb(226 55 47/.7); }
.vol-num{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; width:20px; }
.pb-right .gear{ color:#8b8b90; width:34px; height:34px; border-radius:9px; display:grid; place-items:center; }
.pb-right .gear:hover{ color:var(--text); background:#161617; }
.pb-right .gear svg{ width:19px; height:19px; }

@media(max-width:900px){
  .pb-left,.pb-right{ width:auto; } .pb-right .vol,.vol-num{ display:none; }
  .content{ padding:24px 22px; } .page-head h1{ font-size:34px; } .hero h2{ font-size:46px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <button class="brand" title="Echo">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h10M4 18h16" stroke="var(--red)" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
    <nav class="side-nav">
      <button title="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/></svg></button>
      <button class="on" title="Now Playing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.6"/></svg></button>
      <button title="Stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></button>
    </nav>
    <div class="side-now">
      <div class="wf" id="sideWf"></div>
      <span>Red Thread</span>
    </div>
    <button class="side-settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1A1.6 1.6 0 006.6 19l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.6 1.6 0 003 13.6H3a2 2 0 110-4h.1A1.6 1.6 0 004.6 7L4.5 7a2 2 0 112.8-2.8l.1.1A1.6 1.6 0 0010 3.1V3a2 2 0 114 0v.1a1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8"/></svg></button>
  </aside>

  <div class="main">
    <div class="content">
      <header class="page-head">
        <div class="eyebrow">Now Playing</div>
        <h1>Stay with the sound.</h1>
      </header>

      <div class="grid">
        <section class="hero" id="hero">
          <div class="hero-art" id="heroArt"></div>
          <div class="hero-scrim"></div>
          <div class="hero-content">
            <div class="hero-now"><span class="wf" id="heroWf"></span> Playing from Forms of Silence</div>
            <h2>Red Thread</h2>
            <div class="artist">Mira Vale</div>
            <div class="progress">
              <div class="bar" id="heroBar"><i id="heroFill"></i><span class="thumb" id="heroThumb"></span></div>
              <div class="times"><span id="tCur">0:08</span><span>4:18</span></div>
            </div>
          </div>
          <button class="heart" id="heroHeart" title="Favourite">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.5-9A5.4 5.4 0 0112 5.5 5.4 5.4 0 0121.5 12c-2 4.4-9.5 9-9.5 9z"/></svg>
          </button>
        </section>

        <aside class="panel">
          <div class="un-head">
            <h3>Up next</h3>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h11M4 12h11M4 18h7"/><path d="M17 15l4 3-4 3z" fill="currentColor" stroke="none"/></svg>
          </div>
          <div class="un-sub">A quiet sequence · 13 min</div>
          <div class="un-list" id="unList"></div>
          <div class="divider"></div>
          <div class="signal-label">Signal</div>
          <div class="signal-tiles">
            <div class="tile"><b>Lossless</b><span>24-bit / 96 kHz</span></div>
            <div class="tile"><b>Stereo</b><span>2 channels</span></div>
          </div>
        </aside>
      </div>
    </div>

    <footer class="playerbar">
      <div class="pb-left">
        <div class="art" id="pbArt"></div>
        <div class="meta"><b>Red Thread</b><i>Mira Vale</i></div>
        <button class="pb-heart" id="pbHeart" title="Favourite"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.5-9A5.4 5.4 0 0112 5.5 5.4 5.4 0 0121.5 12c-2 4.4-9.5 9-9.5 9z"/></svg></button>
      </div>

      <div class="pb-center">
        <div class="pill">
          <button title="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
          <button class="txt" title="Lyrics">T</button>
          <button title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 10-10-3-3L5 16z"/><path d="M14 6l3 3"/></svg></button>
          <button title="Comments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.5 7.2L4 21l1.8-5.5A8 8 0 1121 12z"/></svg></button>
        </div>
        <button class="pb-play" id="playBtn" title="Play/Pause">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
        </button>
        <button class="pb-skip" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5.5h2.4v13H7zM19 6v12l-8.5-6z"/></svg></button>
        <button class="pb-skip" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.6 5.5H17v13h-2.4zM5 6l8.5 6L5 18z"/></svg></button>
      </div>

      <div class="pb-right">
        <span class="vicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7"/></svg></span>
        <div class="vol" id="vol"><i id="volFill"></i><span class="knob" id="volKnob"></span></div>
        <span class="vol-num" id="volNum">72</span>
        <button class="gear" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1A1.6 1.6 0 006.6 19l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.6 1.6 0 003 13.6H3a2 2 0 110-4h.1A1.6 1.6 0 004.6 7L4.5 7a2 2 0 112.8-2.8l.1.1A1.6 1.6 0 0010 3.1V3a2 2 0 114 0v.1a1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8"/></svg></button>
      </div>
    </footer>
  </div>
</div>

<script>
"use strict";
(function(){
  const $=(s,r)=>(r||document).querySelector(s);
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const hash=n=>{ const s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); };

  /* ---- CSS-generated album art (no real images) ---- */
  function artFor(seed){
    const h=hash(seed);
    const hues=[["#ff5a4d","#7a0f12","#1a0304"],["#3aa7c9","#0d2a33","#040a0c"],["#ff8a3d","#7a1f0a","#160402"],["#b9c4ff","#2a2f55","#070812"],["#5ad1a0","#0d3327","#03100c"]];
    const c=hues[Math.floor(h*hues.length)%hues.length];
    return "radial-gradient(65% 80% at 28% 18%, "+c[0]+", transparent 62%),"+
           "radial-gradient(60% 70% at 76% 74%, "+c[1]+", transparent 64%),"+
           "conic-gradient(from "+Math.floor(h*360)+"deg at 50% 50%, "+c[2]+", "+c[1]+", "+c[2]+", "+c[0]+", "+c[2]+")";
  }
  /* hero "fabric" — a red sculptural sheet */
  function heroArt(){
    return "radial-gradient(50% 60% at 30% 24%, #ff6a5c, transparent 62%),"+
           "radial-gradient(58% 66% at 72% 70%, #6f1010, transparent 64%),"+
           "linear-gradient(160deg, #2c0607, #120203 58%, #050101)";
  }
  $("#heroArt").style.background=heroArt();
  $("#heroArt").style.backgroundImage=heroArt();
  $("#pbArt").style.background=artFor(3);

  /* ---- up next ---- */
  const upnext=[["Afterimage","North Index",222,11],["Still Water","Ana Lune",306,19],["Pale Distance","Common Field",271,7]];
  const ul=$("#unList");
  upnext.forEach(t=>{ const r=document.createElement("div"); r.className="un-row";
    r.innerHTML='<div class="art" style="background:'+artFor(t[3])+'"></div>'+
      '<div class="meta"><b>'+t[0]+'</b><i>'+t[1]+'</i></div><span class="dur">'+Math.floor(t[2]/60)+':'+String(t[2]%60).padStart(2,"0")+'</span>';
    ul.appendChild(r); });

  /* ---- waveforms ---- */
  function wf(el,n){ el.innerHTML=""; for(let i=0;i<n;i++){ const b=document.createElement("i"); b.style.height=(4+hash(i*1.7)*14)+"px"; el.appendChild(b); } }
  wf($("#heroWf"),9); wf($("#sideWf"),11);

  /* ---- progress + waveform animation ---- */
  const DUR=258000; let pos=8000, playing=true;
  const bars=Array.prototype.slice.call($("#heroWf").children);
  let t0=performance.now();
  function tick(ts){
    requestAnimationFrame(tick);
    const dt=Math.min(48,ts-(tick._p||ts)); tick._p=ts;
    if(playing){ pos+=dt*16; if(pos>DUR) pos=0; }
    const pct=(pos/DUR*100);
    $("#heroFill").style.width=pct+"%";
    $("#heroThumb").style.left=pct+"%";
    const s=Math.floor(pos/1000);
    $("#tCur").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
    // animate waveform
    const tt=ts/1000;
    bars.forEach((b,i)=>{ const v=0.25+0.75*Math.abs(Math.sin(tt*3+i*0.7)); b.style.height=(3+v*15)+"px"; b.style.opacity=(0.5+v*0.5).toFixed(2); });
  }
  requestAnimationFrame(tick);

  /* ---- play/pause ---- */
  $("#playBtn").addEventListener("click",()=>{ playing=!playing;
    $("#playIcon").innerHTML=playing? '<path d="M8 5.5v13l11-6.5z"/>' : '<rect x="7" y="5.5" width="3.6" height="13" rx="1.2"/><rect x="13.4" y="5.5" width="3.6" height="13" rx="1.2"/>'; });

  /* ---- hearts ---- */
  function toggleHeart(btn){ btn.classList.toggle("off"); }
  $("#heroHeart").addEventListener("click",e=>toggleHeart(e.currentTarget));
  $("#pbHeart").addEventListener("click",e=>toggleHeart(e.currentTarget));

  /* ---- volume ---- */
  const vol=$("#vol");
  function setVol(e){ const r=vol.getBoundingClientRect(); const p=clamp((e.clientX-r.left)/r.width,0,1);
    $("#volFill").style.width=(p*100)+"%"; $("#volKnob").style.left=(p*100)+"%"; $("#volNum").textContent=Math.round(p*100); }
  vol.addEventListener("click",setVol);

  /* ---- scrub ---- */
  $("#heroBar").addEventListener("click",e=>{ const r=e.currentTarget.getBoundingClientRect(); pos=clamp((e.clientX-r.left)/r.width,0,1)*DUR; });

  /* ---- sidebar nav ---- */
  document.querySelectorAll(".side-nav button").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll(".side-nav button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); }));

  /* ---- subtle pointer parallax on hero art ---- */
  document.addEventListener("pointermove",e=>{ const cx=(e.clientX/window.innerWidth-0.5), cy=(e.clientY/window.innerHeight-0.5);
    const a=$("#heroArt"); if(a) a.style.backgroundPosition=(50+cx*3)+"% "+(50+cy*3)+"%"; });
})();
</script>
</body>
</html>
